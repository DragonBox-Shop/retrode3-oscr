name: Native NES Sanni OSCR migration

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'src/retrode3/oscr_nes_*.cpp'
      - 'src/retrode3/nes_mmc1_*.cpp'
      - 'src/retrode3/retrode3_cli.cpp'
      - 'include/retrode3/nes_mmc1_*.h'
      - 'tests/test_nes_mapper_banks.py'
      - 'tests/test_real_nes_adapter.py'
      - 'tests/mock_nes_kernel.cpp'
      - 'include/retrode3/oscr_nes_*.h'
      - 'tools/nes-mmc1-lab.sh'
      - 'tools/gen-nes-mmc1-catalog.py'
      - 'tools/build-linux-nes-core.py'
      - 'tools/verify-nes-mapper-sequences.py'
      - 'patches/nes-generated.json'
      - 'tools/gen-nes-banked-catalog.py'
      - 'src/retrode3/oscr_nes_banked_catalog.inc'
      - 'third_party/oscr-firmware'
      - 'Makefile.migration'
      - '.github/workflows/native-nes-migration.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'Makefile.migration'
      - 'src/retrode3/oscr_nes_*.cpp'
      - 'src/retrode3/nes_mmc1_*.cpp'
      - 'src/retrode3/retrode3_cli.cpp'
      - 'include/retrode3/nes_mmc1_*.h'
      - 'tests/test_nes_mapper_banks.py'
      - 'tools/nes-mmc1-lab.sh'
      - 'tools/gen-nes-mmc1-catalog.py'
      - 'include/retrode3/oscr_nes_*.h'
      - 'tests/test_real_nes_adapter.py'
      - 'tests/mock_nes_kernel.cpp'
      - 'tools/build-linux-nes-core.py'
      - 'tools/verify-nes-mapper-sequences.py'
      - 'patches/nes-generated.json'
      - 'tools/gen-nes-banked-catalog.py'
      - 'src/retrode3/oscr_nes_banked_catalog.inc'
      - 'packaging/cores/nes.core'
      - '.github/workflows/native-nes-migration.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-nes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize exact pinned Sanni OSCR C++ source
        run: git submodule update --init third_party/oscr-firmware
      - name: Validate isolated MMC1 lab script and pinned DB generator syntax
        run: |
          sh -n tools/nes-mmc1-lab.sh
          python3 -m py_compile tools/gen-nes-mmc1-catalog.py
      - name: Validate genuine NES bank-reader extraction and shared CLI integration
        run: make -f Makefile.migration test-native-nes-module
      - name: Compile the production read-only NES dynamic core
        run: make -f Makefile.migration native-nes-module
      - name: Compile standalone MMC1 PRG and CHR lab core (never stage or enable)
        run: make -f Makefile.migration native-nes-mmc1-lab
      - name: Offline stage no-auto-enable NES module
        run: |
          make -f Makefile.migration stage-nes-module
          test -f build/migration/stage/usr/lib/retrode3/cores-available/nes.so
          cmp packaging/cores/nes.core build/migration/stage/usr/lib/retrode3/cores-available/nes.core
      - name: Pinned Sanni OSCR firmware submodule must stay untouched
        run: |
          git -C third_party/oscr-firmware diff --exit-code
          test -z "$(git status --porcelain -- third_party/oscr-firmware)"
