name: Native Retrode3 core registry

on:
  push:
    branches:
      - migration/oscr-firmware
  pull_request:
    paths:
      - 'include/retrode3/core_descriptor_v1.h'
      - 'include/retrode3/core_operations_v1.h'
      - 'include/retrode3/ndjson_protocol.h'
      - 'src/retrode3/retrode3_cli.cpp'
      - 'src/retrode3/ndjson_protocol.cpp'
      - 'src/retrode3/retrode3_corectl.cpp'
      - 'src/retrode3/oscr_snes_adapter.cpp'
      - 'src/retrode3/oscr_snes_posix.cpp'
      - 'include/retrode3/oscr_snes_compat.h'
      - 'src/retrode3/oscr_snes_native.cpp'
      - 'src/retrode3/oscr_nes_*.cpp'
      - 'include/retrode3/oscr_nes_*.h'
      - 'tests/test_real_nes_adapter.py'
      - 'tests/mock_nes_kernel.cpp'
      - 'tools/build-linux-nes-core.py'
      - 'packaging/cores/nes.core'
      - 'tests/test_real_snes_adapter.py'
      - 'packaging/cores/snes.core'
      - 'tests/mock_core_module.cpp'
      - 'tests/test_core_registry.py'
      - 'tests/test_shared_core_host.py'
      - 'Makefile.migration'
      - '.github/workflows/core-registry.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize pinned original OSCR source
        run: git submodule update --init third_party/oscr-firmware
      - name: Build genuine upstream SNES dynamic module
        run: make -f Makefile.migration native-snes-module
      - name: Build real native registry CLI
        run: make -f Makefile.migration native-core-registry
      - name: Test module discovery without hardware
        run: make -f Makefile.migration test-core-registry
      - name: Compare genuine SNES module against original acceptance runner
        run: make -f Makefile.migration test-native-snes-module
      - name: Compile genuine Sanni-derived NES mapper-zero adapter and test
        run: make -f Makefile.migration test-native-nes-module
      - name: Prepare offline core image staging without installing or enabling
        run: |
          make -f Makefile.migration stage-snes-module
          test -f build/migration/stage/usr/lib/retrode3/cores-available/snes.so
          cmp packaging/cores/snes.core build/migration/stage/usr/lib/retrode3/cores-available/snes.core
          make -f Makefile.migration stage-nes-module
          test -f build/migration/stage/usr/lib/retrode3/cores-available/nes.so
          cmp packaging/cores/nes.core build/migration/stage/usr/lib/retrode3/cores-available/nes.core
      - name: Verify pinned upstream checkout untouched
        run: |
          git -C third_party/oscr-firmware diff --exit-code
          test -z "$(git status --porcelain -- third_party/oscr-firmware)"
      - name: Empty production registry must never advertise missing cores
        run: |
          output="$(build/migration/retrode3-cli --list-cores)"
          printf '%s\n' "$output" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["event"] == "cores" and d["cores"] == []'
