name: Native Retrode3 core registry

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'Makefile.migration'
      - 'include/retrode3/**'
      - 'src/retrode3/**'
      - 'packaging/cores/**'
      - 'tools/build-linux-*-core.py'
      - 'tests/test_sms_oscr_generator.py'
      - 'tests/test_release_stage.py'
      - 'tests/test_three_core_host.py'
      - 'tests/test_nes_mapper_banks.py'
      - 'tests/mock_nes_kernel.cpp'
      - 'tools/verify-nes-mapper-sequences.py'
      - 'third_party/oscr-firmware'
      - 'tools/preflight-ci.sh'
      - '.github/workflows/core-registry.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'tools/build-linux-sms-core.py'
      - 'tests/test_sms_oscr_generator.py'
      - 'include/retrode3/sms_*.h'
      - 'src/retrode3/oscr_sms_md_adapter.cpp'
      - 'src/retrode3/sms_md_posix_v1.cpp'
      - 'tests/sms_*.cpp'
      - 'tests/test_sms_md_json.py'
      - 'packaging/cores/sms-md.core'
      - 'include/retrode3/core_descriptor_v1.h'
      - 'include/retrode3/core_operations_v1.h'
      - 'include/retrode3/ndjson_protocol.h'
      - 'src/retrode3/retrode3_cli.cpp'
      - 'src/retrode3/ndjson_protocol.cpp'
      - 'src/retrode3/retrode3_corectl.cpp'
      - 'src/retrode3/oscr_snes_adapter.cpp'
      - 'src/retrode3/oscr_snes_posix.cpp'
      - 'include/retrode3/oscr_snes_compat.h'
      - 'src/retrode3/oscr_snes_native.cpp'
      - 'src/retrode3/oscr_md_stage1.cpp'
      - 'src/retrode3/oscr_md_adapter.cpp'
      - 'include/retrode3/oscr_md_stage1.h'
      - 'tests/test_real_md_adapter.py'
      - 'packaging/cores/md.core'
      - 'src/retrode3/oscr_nes_*.cpp'
      - 'include/retrode3/oscr_nes_*.h'
      - 'tools/build-linux-nes-core.py'
      - 'tests/test_real_nes_adapter.py'
      - 'tests/test_nes_mapper_banks.py'
      - 'tools/verify-nes-mapper-sequences.py'
      - 'tests/test_three_core_host.py'
      - 'tests/test_release_stage.py'
      - 'tests/mock_nes_kernel.cpp'
      - 'packaging/cores/nes.core'
      - 'tests/test_real_snes_adapter.py'
      - 'packaging/cores/snes.core'
      - 'tests/mock_core_module.cpp'
      - 'tests/test_core_registry.py'
      - 'tests/test_shared_core_host.py'
      - 'Makefile.migration'
      - 'third_party/oscr-firmware'
      - 'retrode3-lib.c'
      - 'retrode3-lib.h'
      - 'tools/build-linux-snes-core.py'
      - 'tools/build-linux-md-core.py'
      - 'tools/preflight-ci.sh'
      - '.github/workflows/core-registry.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize pinned original OSCR source
        run: git submodule update --init third_party/oscr-firmware
      - name: Validate pre-push smoke-test script syntax
        run: sh -n tools/preflight-ci.sh
      - name: Build genuine upstream SNES dynamic module
        run: make -f Makefile.migration native-snes-module
      - name: Build real native registry CLI
        run: make -f Makefile.migration native-core-registry
      - name: Test module discovery without hardware
        run: make -f Makefile.migration test-core-registry
      - name: Compare genuine SNES module against original acceptance runner
        run: make -f Makefile.migration test-native-snes-module
      - name: Compare actual OSCR MegaDrive .so against accepted standalone reader
        run: make -f Makefile.migration test-native-md-module
      - name: Validate original-Sanni NES module and source guard
        run: make -f Makefile.migration test-native-nes-module
      - name: Validate all three original-derived Cores share one host
        run: make -f Makefile.migration test-three-core-host
      - name: Exercise generic v3 selection and override contract
        run: make -f Makefile.migration test-generic-selection-v3
      - name: Prepare offline core image staging without installing or enabling
        run: |
          make -f Makefile.migration stage-snes-module
          test -f build/migration/stage/usr/lib/retrode3/cores-available/snes.so
          cmp packaging/cores/snes.core build/migration/stage/usr/lib/retrode3/cores-available/snes.core
          make -f Makefile.migration stage-md-module
          test -f build/migration/stage/usr/lib/retrode3/cores-available/md.so
          cmp packaging/cores/md.core build/migration/stage/usr/lib/retrode3/cores-available/md.core
          make -f Makefile.migration stage-nes-module
          test -f build/migration/stage/usr/lib/retrode3/cores-available/nes.so
          cmp packaging/cores/nes.core build/migration/stage/usr/lib/retrode3/cores-available/nes.core
      - name: Verify stable Debian staging filesystem layout
        run: make -f Makefile.migration test-release-stage
      - name: Exercise SMS-0007 experimental read-only v3 adapter
        run: make -f Makefile.migration test-sms-md-module
      - name: Verify pinned upstream checkout untouched
        run: |
          git -C third_party/oscr-firmware diff --exit-code
          test -z "$(git status --porcelain -- third_party/oscr-firmware)"
      - name: Empty production registry must never advertise missing cores
        run: |
          output="$(build/migration/retrode3-cli --list-cores)"
          printf '%s\n' "$output" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["event"] == "cores" and d["cores"] == []'

  sms-python34:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned original OSCR SMS source
        run: git submodule update --init third_party/oscr-firmware
      - name: Generate and validate the SMS core with target Python 3.4
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace python:3.4.10 \
            sh -ec 'python3 tools/build-linux-sms-core.py --size-output build/migration/oscr_sms_size.h --read-output build/migration/oscr_sms_read.h && python3 -m unittest discover -s tests -p "test_sms_oscr_generator.py" -v'

  sms-gcc8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned original OSCR SMS source
        run: git submodule update --init third_party/oscr-firmware
      - name: Generate pinned original on CI host Python
        run: |
          mkdir -p build/migration
          python3 tools/build-linux-sms-core.py --size-output build/migration/oscr_sms_size.h --read-output build/migration/oscr_sms_read.h
          touch build/migration/oscr_sms_generated.stamp
      - name: Compile generated SMS core with GCC 8 and warnings as errors
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace gcc:8 \
            make -f Makefile.migration native-sms-md-module
